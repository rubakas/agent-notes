# Skill trigger-eval prompt set (spec 009, Req 11, SC-013).
#
# Each entry has exactly four keys:
#   skill              a directory name under agent_notes/data/skills
#   category           should_trigger | near_miss
#   prompt             what a real user would type
#   expected_behaviour what the model must do (and, for near_miss, where it routes instead)
#
# Coverage rule (enforced by test_evals.py): every skill directory has at least
# 3 should_trigger and 1 near_miss entry, and the file has at least 100 entries.
#
# USER-ONLY SKILLS. Nine skills set `disable-model-invocation: true`:
# grill-me, grill-with-docs, handoff, improve-codebase-architecture,
# setup-agent-tracker, to-spec, to-tickets, triage, wayfinder.
# The model cannot auto-trigger them, so for these skills:
#   - should_trigger prompts are SLASH INVOCATIONS (the user types /<skill> ...),
#     and expected_behaviour describes what the skill must do once invoked.
#   - near_miss prompts are NATURAL requests where the model must NOT run the
#     skill itself. It may suggest that the user run the slash command.
# Model-invocable skills use natural-language prompts for both categories.

# ---------------------------------------------------------------- chrome-test
- skill: chrome-test
  category: should_trigger
  prompt: "I just finished the new checkout form and it runs locally. Can you get it browser tested?"
  expected_behaviour: "Loads chrome-test, mints a uuid, writes request-<uuid>.md to the file bus and hands the operator only the request path."
- skill: chrome-test
  category: should_trigger
  prompt: "chrome-test the signup flow, the layout broke on mobile widths last time"
  expected_behaviour: "Loads chrome-test and writes a request file with signup and mobile-width scenarios, then waits for report-<uuid>.md."
- skill: chrome-test
  category: should_trigger
  prompt: "run a browser test on the dashboard before I commit"
  expected_behaviour: "Loads chrome-test in end-state mode, writes the request file, and prints operator instructions for starting a claude --chrome session."
- skill: chrome-test
  category: should_trigger
  prompt: "there's a report-3f9a.md in the bus folder from the chrome session, go through the failures"
  expected_behaviour: "Loads chrome-test and runs the Ingest leg: reads the report, triages each FAIL and proposes fixes."
- skill: chrome-test
  category: near_miss
  prompt: "write a Playwright spec that clicks through the login page and asserts the redirect"
  expected_behaviour: "Does not load chrome-test. This is writing an automated test file, handled by the test-writer agent, not a chrome-session handoff."
- skill: chrome-test
  category: near_miss
  prompt: "why does the login page throw a 500 when the session cookie is missing?"
  expected_behaviour: "Does not load chrome-test. Routes to diagnosing-bugs, since it is a server-side failure to reproduce and diagnose."

