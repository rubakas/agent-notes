providers:
  - name: Anthropic
    models:
      - name: Claude Haiku 4.5
        match: "*haiku*"
        price: {in: 1.00, out: 5.00, cache_read: 0.10, cache_write_5m: 1.25, cache_write_1h: 2.00}
        updated_at: "2026-04"
      - name: Claude Fable 5
        match: "*fable*"
        price: {in: 10.00, out: 50.00, cache_read: 1.00, cache_write_5m: 12.50, cache_write_1h: 20.00}
        updated_at: "2026-07"
      - name: Claude Sonnet 5
        match: "*sonnet-5*"
        price: {in: 3.00, out: 15.00, cache_read: 0.30, cache_write_5m: 3.75, cache_write_1h: 6.00}
        updated_at: "2026-07"
      - name: Claude Sonnet
        match: "*sonnet*"
        price: {in: 3.00, out: 15.00, cache_read: 0.30, cache_write_5m: 3.75, cache_write_1h: 6.00}
        updated_at: "2026-04"
      - name: Claude Opus 5 / 4.8 / 4.7 / 4.6 / 4.5
        # Provider-form (dash-separated) ids, matched directly — no normalization.
        # Each version needs an ends-with glob for the bare id plus a `-*` glob for
        # dated snapshots. `*opus-4-1` has NO trailing `*` on purpose: with one it
        # would also match claude-opus-4-10 and misprice a future model as legacy.
        #
        # The `4.x` duplicates are NOT redundant: github-copilot aliases are dotted
        # (github-copilot/claude-opus-4.8) and reach get_price via _opencode_backend.
        match: ["*opus-5", "*opus-5-*",
                "*opus-4-8", "*opus-4-8-*", "*opus-4.8",
                "*opus-4-7", "*opus-4-7-*", "*opus-4.7",
                "*opus-4-6", "*opus-4-6-*", "*opus-4.6",
                "*opus-4-5", "*opus-4-5-*", "*opus-4.5"]
        price: {in: 5.00, out: 25.00, cache_read: 0.50, cache_write_5m: 6.25, cache_write_1h: 10.00}
        updated_at: "2026-07"
      # Explicit anchored pins only — no broad `*opus-4-*`, which would swallow
      # future 4-9 / 4-10 releases and misprice them at the legacy rate. An
      # unmatched Opus must reach the `no pricing entry` warning in get_price.
      - name: Claude Opus 4.1 / 4.0 / 4 / 3 (legacy)
        match: ["*opus-4-1", "*opus-4-1-*", "*opus-4.1",
                "*opus-4-0", "*opus-4-0-*",
                "*opus-4", "*opus-4-202*",
                "*opus-3", "*opus-3-*"]
        price: {in: 15.00, out: 75.00, cache_read: 1.50, cache_write_5m: 18.75, cache_write_1h: 30.00}
        updated_at: "2026-04"

  - name: OpenAI
    models:
      - name: GPT-4 / o-series
        match: ["gpt-*", "o1*", "o3*", "o4*"]
        price: {in: 2.50, out: 10.00, cache_read: 0.50, cache_write_5m: 0.00, cache_write_1h: 0.00}
        updated_at: "2026-04"
