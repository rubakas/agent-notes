name: claude
label: Claude Code
global_home: ~/.claude
local_dir: .claude
layout:
  agents: agents/
  skills: skills/
  rules: rules/
  commands: commands/
  config: CLAUDE.md
  memory: agent-memory/
  settings: settings.json
  agent_extension: md
features:
  agents: true
  skills: true
  rules: true
  commands: true
  memory: true
  frontmatter: claude
  config_style: inline
  settings_template: false
  supports_symlink: true
  session_hook: true
  stop_hook: true
  pretooluse_hooks: true
  allow_entries: true
global_template: global-claude.md
exclude_flag: claude_exclude
accepted_providers: [anthropic, bedrock, vertex]
use_model_class: true
preferred_family: claude
