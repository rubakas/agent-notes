name: opencode
label: OpenCode
global_home: ~/.config/opencode
local_dir: .opencode
layout:
  agents: agents/
  skills: skills/
  config: AGENTS.md
  agent_extension: md
features:
  agents: true
  skills: true
  rules: false
  commands: false
  memory: false
  frontmatter: opencode
  config_style: inline
  settings_template: false
  supports_symlink: true
  session_hook: false
  stop_hook: false
  pretooluse_hooks: false
  allow_entries: false
global_template: global-opencode.md
exclude_flag: opencode_exclude
accepted_providers: [anthropic, openai]
preferred_family: claude
