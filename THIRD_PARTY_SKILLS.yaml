# a496f5513d4a4cf889bc48e189e579f4b0bdf6aa (2026-10-29); 63 of the 261
# commits since the sync commit touch vendored directories. A full re-sync to
# that HEAD is a deliberate out-of-scope decision, not an oversight — see
# specs/001-skills-and-catalog-audit/spec.md findings C4 and C5 for the drift
# inventory and the prompt-injection re-review surface a re-sync would need to
# cover. Instead, spec 011 (Requirement 8) hand-applied a short list of
