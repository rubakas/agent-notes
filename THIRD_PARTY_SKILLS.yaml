# VERIFIED, NOT ASSERTED. On 2026-10-15 every field below was checked
# against a full clone of the upstream repo at sync commit 391a2701:
# each `upstream_path` was resolved with `git ls-tree -r --name-only 391a2701`
# and confirmed to contain a SKILL.md, and every file in each vendored
# skill directory was diffed against `git show 391a2701:<upstream_path>/<file>`
# — not SKILL.md alone. `local_modifications` records exactly what those
# diffs show; files not listed as modified are byte-identical to the sync
# commit. Header facts (HEAD sha/date, commit count, license, copyright)
# come from git commands against the same clone.
#
# An earlier revision of this manifest inferred 14 of the 16 `upstream_path`
# values from a uniform `skills/engineering/<name>` layout; three of them
# (`grill-me`, `grilling`, `handoff`, all under `skills/productivity/`) were
# wrong and are corrected here.

